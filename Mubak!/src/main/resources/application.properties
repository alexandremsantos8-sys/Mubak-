# Nome usado nos logs e pela identificação do aplicativo Spring Boot.
spring.application.name=Mubak!
server.port=8081

# Conexão com o banco. Quando as variáveis de ambiente do Supabase não existem,
# o projeto usa um banco local em memória para permitir o boot em ambiente de desenvolvimento.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:mem:mubak;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SUPABASE_DB_USERNAME:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000

# Configurações do Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.thymeleaf.cache=false

spring.sql.init.separator=;
