<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Configurar perfil | Mubak</title><link rel="stylesheet" th:href="@{/css/produtos.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"></head>
<body><main class="page-shell admin-shell"><nav class="site-nav admin-nav"><a class="brand" th:href="@{/}">MUBAK.</a><div class="nav-links"><a th:href="@{/admin/perfis}">Perfis</a><a th:href="@{/admin/usuarios}">Usuários</a></div><a class="nav-action" th:href="@{/admin/perfis}">Voltar</a></nav>
<div class="content-wrap"><header class="page-header"><div><p class="eyebrow">MUBAK / PERFIL</p><h1>Permissões.</h1><p class="intro">Ative ou retire acessos individualmente para este perfil.</p></div></header>
<form class="product-form" th:action="@{/admin/perfis}" method="post"><input type="hidden" name="id" th:value="${perfil.id}"><section class="form-section"><h2>Identidade e acessos</h2><div class="field full-width"><label for="nome">Nome do perfil</label><input id="nome" name="nome" th:value="${perfil.nome}" placeholder="Ex.: SUPORTE" required></div><div class="profile-permissions full-width"><label class="permission"><input type="checkbox" name="venda" th:checked="${perfil.venda}"> Tela de venda</label><label class="permission"><input type="checkbox" name="compra" th:checked="${perfil.compra}"> Tela de compra</label><label class="permission"><input type="checkbox" name="gerenciamentoProduto" th:checked="${perfil.gerenciamentoProduto}"> Gerenciamento de produto</label><label class="permission"><input type="checkbox" name="administracao" th:checked="${perfil.administracao}"> Tela de administração</label></div></section><div class="form-actions"><a class="button button-secondary" th:href="@{/admin/perfis}">Cancelar</a><button class="button button-primary" type="submit">Salvar permissões</button></div></form>
</div></main></body></html>
