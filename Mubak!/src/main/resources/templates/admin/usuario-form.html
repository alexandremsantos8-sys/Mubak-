<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Editar usuário | Mubak</title><link rel="stylesheet" th:href="@{/css/produtos.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"></head>
<body><main class="page-shell admin-shell"><nav class="site-nav admin-nav"><a class="brand" th:href="@{/}">MUBAK.</a><div class="nav-links"><a th:href="@{/admin/perfis}">Perfis</a><a th:href="@{/admin/usuarios}">Usuários</a></div><a class="nav-action" th:href="@{/admin/usuarios}">Voltar</a></nav>
<div class="content-wrap"><header class="page-header"><div><p class="eyebrow">MUBAK / USUÁRIO</p><h1>Editar acesso.</h1><p class="intro">Atualize os dados da conta sem expor a senha atual.</p></div></header>
<form class="product-form" th:action="@{/admin/usuarios/{id}(id=${usuario.id})}" method="post"><section class="form-section"><h2>Dados da conta</h2><div class="field"><label for="nome">Nome</label><input id="nome" name="nome" th:value="${usuario.nome}" required></div><div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" th:value="${usuario.email}" required></div><div class="field"><label for="documento">CPF / CNPJ</label><input id="documento" name="documento" th:value="${usuario.documento}" required></div><div class="field"><label for="senha">Nova senha</label><input id="senha" name="senha" type="password" minlength="6"><small class="field-help">Deixe em branco para manter a senha atual.</small></div><div class="field"><label for="perfil">Perfil</label><select id="perfil" name="perfil" required><option th:if="${usuario.perfil == 'ROOT'}" value="ROOT" selected>ROOT</option><option th:each="p : ${perfis}" th:value="${p.nome}" th:text="${p.nome}" th:selected="${p.nome == usuario.perfil}"></option></select></div></section><div class="form-actions"><a class="button button-secondary" th:href="@{/admin/usuarios}">Cancelar</a><button class="button button-primary" type="submit">Salvar alterações</button></div></form>
</div></main></body></html>
