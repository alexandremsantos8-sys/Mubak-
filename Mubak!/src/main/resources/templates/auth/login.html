<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8">
    <title>Login | Mubak</title><link rel="stylesheet" th:href="@{/css/produtos.css}">
</head><body><main class="page-shell">
    <div class="content-wrap">
        <div class="alert alert-error" th:if="${erro}" th:text="${erro}">

        </div><div class="alert alert-success" th:if="${mensagem}" th:text="${mensagem}">
        </div><form class="product-form" th:action="@{/login}" method="post">
            <h1>Entrar.</h1>
            <section class="form-section"><label>CPF/CNPJ ou e-mail</label>
                <input name="identificador" required><label>Senha</label>
                <input type="password" name="senha" required></section><div class="form-actions">
                    <button class="button button-primary" type="submit">Entrar</button>
                    <a class="button button-secondary" th:href="@{/cadastro}">Criar conta</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
