<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Criar conta | Mubak</title><link rel="stylesheet" th:href="@{/css/produtos.css}"></head><body><main class="page-shell"><div class="content-wrap"><h1>Criar conta.</h1><div class="alert alert-error" th:if="${erro}" th:text="${erro}"></div><form class="product-form" th:action="@{/cadastro}" th:object="${usuarioForm}" method="post"><section class="form-section"><label>Nome/Razão Social</label><input th:field="*{nome}" required><label>CPF/CNPJ</label><input th:field="*{documento}" placeholder="XXX.XXX.XXX-XX ou XX.XXX.XXX/0001-XX" maxlength="18" required><label>Data de nascimento do titular</label><input th:field="*{dataNascimento}" placeholder="DD/MM/AAAA" maxlength="10" required><label>E-mail</label><input type="email" th:field="*{email}" placeholder="test@mail.com.br" required><label>Confirmação de e-mail</label><input type="email" th:field="*{confirmacaoEmail}" required><label>Senha</label><input type="password" th:field="*{senha}" required><label>Confirmação de senha</label><input type="password" th:field="*{confirmacaoSenha}" required></section><div class="form-actions"><button class="button button-primary">Criar conta</button><a class="button button-secondary" th:href="@{/login}">Login</a></div></form></div></main></body></html>
