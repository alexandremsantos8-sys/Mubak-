<!DOCTYPE html>
<!-- Exibição somente leitura de um produto carregado pelo id da URL. -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${produto.nome + ' | Mubak!'}">Produto | Mubak!</title>
    <link rel="stylesheet" th:href="@{/css/produtos.css(v=5)}">
    <script th:src="@{/js/navigation.js}" defer></script>
</head>
<body>
<main class="page-shell">
    <nav class="site-nav" aria-label="Navegação principal">
        <a class="brand" th:href="@{/}">MUBAK.</a>
        <div class="nav-links"><a th:href="@{/}">Início</a><a th:href="@{/produtos}">Produtos</a><a th:if="${admin}" th:href="@{/admin}">Administração</a></div>
        <a class="nav-action" th:if="${!logado}" th:href="@{/login}">Entrar</a>
        <form th:if="${logado}" th:action="@{/logout}" method="post"><button class="nav-action" type="submit">Sair</button></form>
        <a class="cart-link" th:href="@{/carrinho}" th:aria-label="${'Abrir carrinho, ' + cartCount + ' itens'}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.1 10.1a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 1.9-1.4L22 8H6M10 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2Zm8 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/></svg>
            <span class="cart-badge" th:if="${cartCount > 0}" th:text="${cartCount}"></span>
        </a>
        <button class="mobile-menu" type="button" aria-label="Abrir menu" aria-expanded="false">&#9776;</button>
    </nav>
    <div class="content-wrap">
    <header class="detail-header">
        <a class="button button-secondary" th:href="@{/produtos}">Voltar ao catálogo</a>
    </header>
    <article class="detail-layout">
        <img class="detail-image" th:src="${produto.imagemUrl}" th:alt="${produto.nome}" onerror="this.onerror=null;this.src='/images/produto-placeholder.svg';">
        <div class="detail-content">
            <p class="product-category" th:text="${produto.categoria}"></p>
            <h1 th:text="${produto.nome}"></h1>
            <p class="detail-price" th:text="${'R$ ' + #numbers.formatDecimal(produto.preco, 1, 2)}"></p>
            <p class="detail-description" th:text="${produto.descricao}"></p>
            <form class="add-to-cart-form" th:action="@{/carrinho/itens/{id}(id=${produto.id})}" method="post">
                <button class="button button-primary" type="submit" th:disabled="${produto.estoque == null or produto.estoque < 1}">Adicionar ao carrinho</button>
                <span class="field-help" th:if="${produto.estoque == null or produto.estoque < 1}">Produto indisponível no momento.</span>
            </form>
            <dl class="detail-data">
                <div><dt>Estoque</dt><dd th:text="${produto.estoque == 0 ? 'Sem estoque' : produto.estoque + ' unidades disponíveis'}"></dd></div>
            </dl>
        </div>
    </article>
    </div>
</main>
<a class="whatsapp-float" href="https://wa.me/5575999999999" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg></a></body>
</html>
