<!DOCTYPE html>
<!-- Formulário compartilhado por criação e edição; o id decide texto e destino do POST. -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${produto.id == null ? 'Novo produto | Mubak' : 'Editar produto | Mubak'}">Produto | Mubak</title>
    <link rel="stylesheet" th:href="@{/css/produtos.css(v=4)}">
    <script th:src="@{/js/navigation.js}" defer></script>
</head>
<body>
<main class="page-shell">
    <nav class="site-nav" aria-label="Navegação principal">
        <a class="brand" th:href="@{/}">MUBAK.</a>
        <div class="nav-links"><a th:href="@{/}">Loja</a><a th:href="@{/produtos}">Produtos</a><a th:href="@{/admin}">Administração</a></div>
        <a class="nav-action" th:href="@{/produtos}">Loja</a>
        <button class="mobile-menu" type="button" aria-label="Abrir menu" aria-expanded="false">&#9776;</button>
    </nav>
    <div class="content-wrap">
    <header class="page-header">
        <div>
            <p class="eyebrow">ADMINISTRAÇÃO / CATÁLOGO</p>
            <h1 th:text="${produto.id == null ? 'Cadastrar produto' : 'Editar produto'}">Cadastrar produto</h1>
            <p class="intro" th:text="${produto.id == null ? 'Adicione um item ao catálogo com preço, estoque e imagem.' : 'Atualize os dados do produto no catálogo.'}">Adicione um item ao catálogo com preço, estoque e imagem.</p>
        </div>
        <a class="button button-secondary" th:href="@{/produtos}">Ver produtos</a>
    </header>

    <div class="alert alert-error" th:if="${erro}" th:text="${erro}"></div>

    <!-- multipart/form-data é necessário para enviar a imagem junto dos campos do produto. -->
    <form class="product-form"
          th:action="${produto.id == null ? '/produtos' : '/produtos/' + produto.id}"
          th:object="${produto}" method="post" enctype="multipart/form-data">
        <section class="form-section">
            <h2>Informações do produto</h2>
            <div class="field full-width">
                <label for="nome">Nome</label>
                <input id="nome" type="text" th:field="*{nome}" maxlength="120" required>
                <small class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>
            </div>
            <div class="field full-width">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" th:field="*{descricao}" maxlength="2000" rows="5" required></textarea>
                <small class="field-error" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></small>
            </div>
            <div class="field">
                <label for="categoria">Categoria</label>
                <input id="categoria" type="text" th:field="*{categoria}" maxlength="80" required>
                <small class="field-error" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></small>
            </div>
        </section>

        <section class="form-section">
            <h2>Comercial</h2>
            <div class="field">
                <label for="preco">Preço (R$)</label>
                <input id="preco" type="number" th:field="*{preco}" min="0.01" step="0.01" required>
                <small class="field-error" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}"></small>
            </div>
            <div class="field">
                <label for="estoque">Estoque disponível</label>
                <input id="estoque" type="number" th:field="*{estoque}" min="0" step="1" required>
                <small class="field-error" th:if="${#fields.hasErrors('estoque')}" th:errors="*{estoque}"></small>
            </div>
            <div class="field full-width">
                <label for="imagem">Imagem do produto</label>
                <input id="imagem" name="imagem" type="file" accept="image/jpeg,image/png,image/webp,image/gif" th:required="${produto.id == null}">
                <small class="field-help" th:text="${produto.id == null ? 'Formatos aceitos: JPG, PNG, WEBP ou GIF.' : 'Deixe vazio para manter a imagem atual.'}">Formatos aceitos: JPG, PNG, WEBP ou GIF.</small>
            </div>
        </section>

        <div class="form-actions">
            <a class="button button-secondary" th:href="@{/produtos}">Cancelar</a>
            <button class="button button-primary" type="submit" th:text="${produto.id == null ? 'Cadastrar produto' : 'Salvar alterações'}">Cadastrar produto</button>
        </div>
    </form>
    </div>
</main>

</html>
